name: Deploy Project Website

on:
  push:
    branches: [master]
    paths:
      - webui/**
      - .github/workflows/deploy-webui.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: webui
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
